<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 AI 학습·업무 도우미</title>
  <style>
    :root {
      --bg: #eceff3;
      --panel: #ffffff;
      --header: #ffe066;
      --header-deep: #f7cd32;
      --text: #202124;
      --subtle: #667084;
      --bubble-me: #fee500;
      --bubble-other: #ffffff;
      --focus: #1f6feb;
      --shadow: 0 14px 36px rgba(36, 45, 66, 0.2);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, #f6f7fb 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(420px, 100%);
      height: min(860px, calc(100vh - 40px));
      background: var(--panel);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #dfe4ec;
    }

    .topbar {
      background: linear-gradient(180deg, var(--header) 0%, var(--header-deep) 100%);
      padding: 10px 14px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .status {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #27272a;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      flex: 0 0 auto;
    }

    .chat-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 14px;
      background: #f3f4f8;
    }

    .notice {
      margin: 0 0 12px;
      color: #505b74;
      font-size: 12px;
      text-align: center;
    }

    .bubble {
      max-width: 90%;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 14px;
      border: 1px solid rgba(32, 33, 36, 0.08);
    }

    .bubble.other {
      background: var(--bubble-other);
      border-top-left-radius: 8px;
    }

    .bubble.me {
      margin-left: auto;
      background: var(--bubble-me);
      border-top-right-radius: 8px;
    }

    .engine-panel {
      background: #fff;
      border: 1px solid #d7deea;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 8px;
    }

    .engine-label {
      margin: 0;
      padding: 9px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e6eaf2;
      font-size: 12px;
      color: var(--subtle);
      font-weight: 600;
    }

    iframe {
      width: 100%;
      height: min(55vh, 460px);
      border: 0;
      display: block;
      background: #fff;
    }

    .help { padding: 12px 16px; background: #fff; border-top: 1px solid #e0e5ef; font-size: 12px; line-height: 1.6; }
    .help p { margin: 0 0 6px; }
    a { color: #164da3; }
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      iframe {
        height: min(58vh, 460px);
      }
    }
  </style>
</head>
<body>
  <section class="app" aria-label="학교 AI 학습·업무 도우미">
    <header class="topbar">
      <div class="title-row">
        <div class="profile">
          <span class="avatar" aria-hidden="true">🤖</span>
          <h1 class="chat-title">학교 AI 학습·업무 도우미</h1>
        </div>
      </div>
    </header>

    <main aria-label="AI 대화 영역">
      <p class="notice">Copilot Studio 기반 교육용 AI 에이전트</p>
      <p class="bubble other">안녕하세요! 아래 채팅창에서 질문을 입력해 주세요. 답변은 중요한 내용일수록 원문과 함께 확인해 주세요.</p>
      <p class="notice">이름·연락처·성적·비밀번호 등 개인정보와 비공개 자료를 입력하지 마세요.</p>
      <section class="engine-panel" aria-label="Copilot Studio chat engine">
        <p class="engine-label">Copilot Studio Web Chat</p>
        <iframe
          title="학교 AI 도우미 채팅창"
          src="https://copilotstudio.microsoft.com/environments/Default-b191802e-6d1f-456c-af2d-ebd2ab881e8e/bots/nara_multimodelaiagent_vb2GGk/webchat?__version__=2&enableFileAttachment=false&cliAgent=true">
        </iframe>
      </section>
    </main>

    <footer class="help">
      <p>질문은 위 채팅창 안에 입력하세요. 파일 첨부 지원은 확인 중입니다.</p>
      <p>채팅창이 표시되지 않으면 <a href="https://copilotstudio.microsoft.com/environments/Default-b191802e-6d1f-456c-af2d-ebd2ab881e8e/bots/nara_multimodelaiagent_vb2GGk/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true" target="_blank" rel="noopener noreferrer">채팅을 새 창에서 열기</a>를 이용하세요. 계정·권한에 따라 로그인이 필요할 수 있습니다.</p>
      <a href="https://github.com/sinnarasam/ai#readme" target="_blank" rel="noopener noreferrer">사용 안내·테스트 기록</a>
    </footer>
  </section>
</body>
</html>
